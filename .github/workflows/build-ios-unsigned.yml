name: Build Unsigned iOS App

on:
  workflow_dispatch:
  push:
    branches: [ real_time_tracking, main, dev ]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios-unsigned.yml'

jobs:
  build-ipa:
    name: Build Unsigned IPA on macOS
    runs-on: macos-14

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies & Sync Capacitor iOS
        run: |
          npm ci
          npx cap sync ios

      - name: 4. Build unsigned xcarchive with Xcode
        run: |
          cd ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 5. Package into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r App-unsigned.ipa Payload
          mkdir -p output
          mv App-unsigned.ipa output/

      - name: 6. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: output/App-unsigned.ipa
          retention-days: 7
